<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">Azure Key Vault private secrets architecture</title><desc id="desc">GitHub Actions provisions Azure resources. An application workload resolves the vault through private DNS and connects to its private endpoint. Microsoft Entra ID and RBAC authorize the workload.</desc><rect width="1200" height="540" rx="24" fill="#f5f8fc"/><text x="600" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#17365d">AZURE KEY VAULT | PRIVATE SECRETS ARCHITECTURE</text><rect x="35" y="105" width="220" height="118" rx="14" fill="#e8f2ff" stroke="#4a86c5" stroke-width="2"/><text x="145" y="142" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#17365d">GitHub Actions</text><text x="145" y="172" text-anchor="middle" font-family="Arial" font-size="14" fill="#17365d">Terraform checks</text><text x="145" y="194" text-anchor="middle" font-family="Arial" font-size="14" fill="#17365d">Checkov scan</text><rect x="310" y="105" width="220" height="118" rx="14" fill="#e2f0d9" stroke="#70ad47" stroke-width="2"/><text x="420" y="142" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#275317">Azure Identity</text><text x="420" y="172" text-anchor="middle" font-family="Arial" font-size="14" fill="#275317">OIDC recommended</text><text x="420" y="194" text-anchor="middle" font-family="Arial" font-size="14" fill="#275317">Least privilege</text><path d="M255 164 H310" stroke="#4472c4" stroke-width="3" fill="none"/><path d="M300 157 L310 164 L300 171" stroke="#4472c4" stroke-width="3" fill="none"/><rect x="575" y="84" width="590" height="370" rx="22" fill="#ffffff" stroke="#78909c" stroke-width="2" stroke-dasharray="8 5"/><text x="870" y="119" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#17365d">Azure Virtual Network</text><rect x="610" y="152" width="230" height="92" rx="13" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="725" y="183" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#604a00">App / VM / AKS</text><text x="725" y="208" text-anchor="middle" font-family="Arial" font-size="14" fill="#604a00">Managed Identity</text><rect x="890" y="152" width="235" height="92" rx="13" fill="#e4dfec" stroke="#9673a6" stroke-width="2"/><text x="1007" y="183" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#4b3760">Private DNS</text><text x="1007" y="208" text-anchor="middle" font-family="Arial" font-size="13" fill="#4b3760">vaultcore.azure.net</text><path d="M840 198 H890" stroke="#9673a6" stroke-width="3" fill="none"/><path d="M880 191 L890 198 L880 205" stroke="#9673a6" stroke-width="3" fill="none"/><rect x="890" y="310" width="235" height="86" rx="13" fill="#ddebf7" stroke="#5b9bd5" stroke-width="2"/><text x="1007" y="343" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#17365d">Private Endpoint</text><text x="1007" y="368" text-anchor="middle" font-family="Arial" font-size="14" fill="#17365d">Private IP · TCP 443</text><path d="M1007 244 V310" stroke="#9673a6" stroke-width="3" fill="none"/><path d="M1000 300 L1007 310 L1014 300" stroke="#9673a6" stroke-width="3" fill="none"/><rect x="330" y="310" width="400" height="110" rx="14" fill="#fce4d6" stroke="#c65911" stroke-width="2"/><text x="530" y="344" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#7c2d12">Azure Key Vault</text><text x="530" y="372" text-anchor="middle" font-family="Arial" font-size="14" fill="#7c2d12">RBAC · Public access disabled</text><text x="530" y="395" text-anchor="middle" font-family="Arial" font-size="14" fill="#7c2d12">Soft delete · Purge protection</text><path d="M890 354 H730" stroke="#5b9bd5" stroke-width="3" fill="none"/><path d="M740 347 L730 354 L740 361" stroke="#5b9bd5" stroke-width="3" fill="none"/><path d="M420 223 V275 H530 V310" stroke="#70ad47" stroke-width="3" stroke-dasharray="7 5" fill="none"/><text x="600" y="488" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#7f1d1d">Secure access requires BOTH private network reachability and valid identity authorization.</text><text x="600" y="516" text-anchor="middle" font-family="Arial" font-size="13" fill="#526174">Architecture sample • Deploy and validate before claiming a live production implementation</text></svg>